<!DOCTYPE html>
<html>
<head>
    <title>Mi ubicación en Google Maps</title>
    <meta charset="UTF-8">
    <style>
        #map {
            height: 400px;  /* Altura fija obligatoria para el mapa */
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Mi ubicación exacta</h1>
    <button onclick="getLocation()">Obtener mi ubicación y ver mapa</button>
    <p id="demo"></p>
    
    <!-- Contenedor del mapa -->
    <div id="map"></div>

    <script>
        let map;        // variable global para el mapa
        let marker;     // variable global para el marcador

        function getLocation() {
            if (navigator.geolocation) {
                const options = {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                };
                navigator.geolocation.getCurrentPosition(showPosition, showError, options);
            } else {
                document.getElementById("demo").innerHTML = "Geolocalización no soportada.";
            }
        }

        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const precision = position.coords.accuracy;
            
            document.getElementById("demo").innerHTML = 
                `Latitud: ${lat}<br>Longitud: ${lon}<br>Precisión: ±${precision} metros`;

            // --- Aquí creamos o actualizamos el mapa ---
            const myLatLng = { lat, lng: lon };

            // Si el mapa no existe aún, lo creamos
            if (!map) {
                map = new google.maps.Map(document.getElementById("map"), {
                    center: myLatLng,
                    zoom: 16,      // Zoom más cercano
                });
                marker = new google.maps.Marker({
                    position: myLatLng,
                    map: map,
                    title: "Tu ubicación"
                });
            } else {
                // Si ya existe, solo movemos centro y marcador
                map.setCenter(myLatLng);
                marker.setPosition(myLatLng);
            }
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    document.getElementById("demo").innerHTML = "Permiso denegado.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    document.getElementById("demo").innerHTML = "Ubicación no disponible.";
                    break;
                case error.TIMEOUT:
                    document.getElementById("demo").innerHTML = "Tiempo de espera agotado.";
                    break;
            }
        }
    </script>

    <!-- Carga de Google Maps con TU clave API -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB0B-teq6ztQjfsznf8X503bKEPnVCSsD8&callback=Function.prototype">
    </script>
    <!-- El callback vacío evita que Google llame a initMap; nosotros creamos el mapa manualmente -->
</body>
</html>
